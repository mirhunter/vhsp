# Matches audit.py's JSON-lines format (vhsp_ctl/audit.py's log_action)
# for a failed operator-admin-UI login -- see that module's own
# docstring for why "ip" is only present on the three login-related
# call sites in web.py, not every audit entry.
#
# One line per event (audit.log is JSON-lines, never pretty-printed),
# so a simple single-line failregex is enough -- no multi-line log
# parsing needed.

[Definition]
failregex = ^\{.*"action":\s*"admin\.login_failed".*"ip":\s*"<HOST>".*\}\s*$
ignoreregex =

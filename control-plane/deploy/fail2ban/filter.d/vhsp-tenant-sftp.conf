# atmoz/sftp's own log (redirected from its entrypoint's stdout/stderr
# via a shell wrapper -- see images/sftp/'s own entrypoint script) is
# raw OpenSSH daemon output with NO timestamp prefix and NO
# "sshd[pid]:"-style wrapper at all -- verified directly, real lines
# look like:
#   Failed password for root from 113.44.174.240 port 59880 ssh2
#   Invalid user  from 172.17.0.1 port 50642
#   Connection closed by authenticating user root 113.44.174.240 port 36322 [preauth]
# not the syslog-wrapped form /var/log/auth.log gets for free.
#
# First tried [INCLUDES] before = sshd.conf to reuse the stock filter's
# own failregex definitions, overriding only datepattern -- didn't work
# in practice (confirmed with a real dry-run against a synthetic
# "Failed password..." line: zero matches even after date-parsing
# itself was confirmed fixed). The stock filter's failregex is applied
# against a `prefregex`-extracted <F-CONTENT> group, itself built from
# common.conf's own prefix-stripping macros -- not something that
# reliably composes via [INCLUDES] the way this file first assumed.
# Simpler and more reliable: a small, self-contained filter (same shape
# as vhsp-admin-login.conf/vhsp-tenant-admin-login.conf) matching the
# handful of line forms that actually matter here directly, with no
# dependency on the stock filter's own macro system.
#
# Also tried an explicit [Init] datepattern = {NONE} override (this
# log has no timestamps at all, so date-parsing has nothing to find).
# That was wrong, not just unnecessary: fail2ban-regex showed a real
# "Date template hits: [N]" count against `^` and offline analysis
# matched fine, but the LIVE pyinotify-watched jail never registered
# any failures at all -- confirmed via `fail2ban-client -d`'s reload
# trace showing a suspicious internal `{UNB}^` date-pattern entry for
# this jail that neither of the other two (working) custom filters
# ever produce, and via DEBUG-level fail2ban.log showing the
# pyinotify layer receiving the file's IN_MODIFY event but the filter
# layer never logging any line processing afterward -- i.e. the {NONE}
# override broke live processing even though it didn't break the
# offline dry-run tool. vhsp-admin-login.conf/vhsp-tenant-admin-login.conf
# never set [Init] datepattern at all and work correctly live: fail2ban's
# default date detector simply doesn't find a date on an undated line and
# falls back to "now" on its own, which is exactly the desired behavior
# here too. Dropped the [Init] section entirely to match that proven
# working shape.

[Definition]
failregex = ^Failed \S+ for (?:invalid user )?\S* ?from <HOST> port \d+
            ^[iI](?:llegal|nvalid) user \S* from <HOST> port \d+
            ^Received disconnect from <HOST> port \d+:11:
ignoreregex =

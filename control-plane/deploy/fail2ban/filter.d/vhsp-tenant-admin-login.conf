# Matches images/tenant-admin/app.py's login_attempts.log format (JSON
# lines, one per failed login -- see _login_record_failure). Watched via
# a wildcarded logpath across every tenant (see jail.local's
# [vhsp-tenant-admin-login]), so this filter doesn't need to know which
# tenant a given line came from -- the tenant-level allowlist for THIS
# jail is applied one layer up, in app.py itself, before a line is ever
# written (an allowlisted IP's failures never make it into this file at
# all), not here.

[Definition]
failregex = ^\{.*"ip":\s*"<HOST>".*\}\s*$
ignoreregex =

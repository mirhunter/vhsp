<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site maintenance</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --surface: #fff; --fg: #1a1d23; --muted: #6b7280; --border: #e5e7eb;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101114; --surface: #17181c; --fg: #e8e9ec; --muted: #9199a8; --border: #2a2d34;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .card {
    max-width: 380px; margin: 0 1.5rem; padding: 2rem; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  h1 { font-size: 1.2rem; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 0.6rem; }
  p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>We'll be right back</h1>
    <p>This site is temporarily undergoing maintenance.<br>Please check back again soon.</p>
  </div>
</body>
</html>

[www]
user = nginx
group = nginx

listen = /run/php-fpm.sock
listen.owner = nginx
listen.group = nginx

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; PHP-FPM's default clear_env=yes strips the container's environment
; before PHP ever sees it -- verified: getenv("DB_HOST") came back empty
; and mysqli silently fell back to a local socket that doesn't exist
; ("No such file or directory"), not an obviously-env-related error. Safe
; to disable here since this container's entire environment is exactly
; what the control plane deliberately injected (DB_* vars) -- there's
; nothing unrelated to leak through.
clear_env = no

php_admin_value[open_basedir] = /var/www/html:/tmp

; disable_functions is deliberately NOT set here. It's generated into
; zz-tenant.conf (this same directory, loaded after this file) by the
; entrypoint's watcher loop from the tenant-admin container's self-service
; toggle state -- one source of truth, not two files fighting over the
; same directive. See entrypoint.sh and images/tenant-admin/.

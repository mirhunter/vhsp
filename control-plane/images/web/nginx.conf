server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Recovers the real client IP/scheme into $remote_addr/$http_x_forwarded_proto
    # instead of the VM-local Traefik container's own address (what every
    # access-log line showed before this) -- see entrypoint.sh's generation
    # of this file. Not tenant-configurable: this is a platform-topology
    # fact (which proxy genuinely sits in front of this container), same
    # reasoning as VHSP_ADMIN_TRUST_PROXY for the operator UI.
    include /etc/nginx/vhsp-realip.conf;

    # Written to the shared logs volume, not the container's own
    # filesystem or stdout -- that's what makes these readable from the
    # tenant-admin container without giving it docker.sock access.
    access_log /var/log/vhsp/web-access.log;
    error_log /var/log/vhsp/web-error.log warn;

    # Operator-only maintenance hold (see vhsp_ctl/provisioner.py's
    # set_tenant_maintenance_mode) -- the check itself lives at the top of
    # each content-serving location below (location /, @fallback, and
    # ~ \.php$), not once here at server level, despite that being the
    # obvious place to put a single copy. Verified directly: nginx's
    # `error_page` does NOT reliably intercept a `return CODE;` that comes
    # from an `if` block at bare server level (confirmed empirically --
    # falls back to nginx's generic built-in error page instead of
    # /__vhsp_maintenance.html below), but the identical if+return DOES
    # get intercepted correctly once nested inside a location block. Real,
    # reproducible nginx behavior, not a guess -- see the three repeated
    # `if (-f /data/.vhsp-maintenance)` checks below for the actual
    # enforcement points. Practical consequence of this shape: the tenant's
    # own IP allow/deny and password-protection toggles (from
    # vhsp-tenant.conf, included below) run in nginx's access-control
    # phase, which happens BEFORE any location's content phase -- so a
    # visitor blocked by those still sees that plain response rather than
    # the maintenance page, and only a visitor who *passes* them reaches a
    # location and gets correctly shown maintenance instead of the site.
    # An acceptable, narrow gap (only matters for tenants who have both an
    # IP/auth toggle AND a maintenance hold on at once), not a security
    # concern -- those visitors are still blocked either way, just with
    # different wording. 503, not a plain 200: the semantically correct
    # status for "temporarily down" (search engines treat it as transient
    # rather than deindexing the site) and it reads as a real outage to
    # any uptime monitoring the tenant runs, not a normal page load.
    # Mail (inbound relay vs. IMAP/submission) has its own, separate
    # maintenance handling -- see images/mail/entrypoint.sh -- this only
    # ever covers the web front-end.
    error_page 503 /__vhsp_maintenance.html;
    location = /__vhsp_maintenance.html {
        internal;
        alias /usr/share/vhsp/maintenance.html;
        add_header Retry-After 3600 always;
    }

    # Tenant self-service config (password protection, custom error pages,
    # IP allow/deny, redirects) -- generated and validated by this
    # container's own entrypoint.sh from plain data files a tenant edits
    # via the tenant-admin UI (see that image's app.py), never written
    # directly by tenant-admin itself. Deliberately NOT under
    # /etc/nginx/conf.d/ or /etc/nginx/http.d/ -- Alpine's stock
    # nginx.conf globs both of those at a context (root / http) too broad
    # for server-level directives like `location`/`auth_basic` to be valid
    # in, which would make every reload a config-syntax error. Always
    # exists (entrypoint creates it empty on first boot) so this include
    # never fails even before a tenant has configured anything.
    include /etc/nginx/vhsp-tenant.conf;

    # 404s fall back to the tenant's own front controller by default (e.g.
    # for a placeholder "site being updated" page with no real routes yet).
    # Prefers index.php over index.html so this doubles as the standard
    # front-controller rewrite PHP apps/CMSes (WordPress, Laravel, etc.)
    # expect for pretty URLs -- a tenant who installs one of those gets
    # working permalinks for free, not just a fallback to the placeholder
    # page. Listing both in try_files (rather than a `rewrite ... last`
    # back to a single fixed target) also means a tenant with neither file
    # present cleanly 404s instead of looping back into @fallback forever.
    # A tenant can opt back into plain 404s by dropping an empty
    # `.vhsp-no-404-fallback` file in their webroot (writable via their own
    # SFTP access -- no control-plane involvement needed, same "just a file
    # on a volume they already have" self-service pattern used elsewhere).
    location / {
        if (-f /data/.vhsp-maintenance) {
            return 503;
        }
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        if (-f /data/.vhsp-maintenance) {
            return 503;
        }
        if (-f $document_root/.vhsp-no-404-fallback) {
            return 404;
        }
        # try_files only re-dispatches through the ~ \.php$ location for its
        # truly *last* parameter -- an earlier parameter that happens to
        # exist gets served as a static file by *this* location instead
        # (verified: without this, an existing index.php came back as raw
        # source, never executed). rewrite ... last forces a real internal
        # redirect to /index.php, re-running location matching so fastcgi
        # actually picks it up; only reached at all when index.php exists,
        # so no loop risk.
        if (-f $document_root/index.php) {
            rewrite ^ /index.php last;
        }
        try_files /index.html =404;
    }

    location ~ \.php$ {
        if (-f /data/.vhsp-maintenance) {
            return 503;
        }
        # Classic nginx+PHP-FPM RCE class: without this, a request like
        # /wp-content/uploads/photo.jpg/x.php matches this location (it
        # ends in .php) and gets passed to FPM even though photo.jpg/x.php
        # isn't a real file. If PHP's cgi.fix_pathinfo=1 (the stock
        # default) is in effect, FPM walks back to the first path segment
        # that *does* exist (photo.jpg) and executes it as PHP, treating
        # "/x.php" as PATH_INFO -- so an uploaded "image" containing a PHP
        # payload runs. This redirects before ever reaching fastcgi_pass
        # unless $uri is a real file on disk -- @php_not_found below, not
        # a bare =404, so scanner noise (wp-config.php.bak, old xmlrpc.php
        # exploits, etc.) gets a clean 301 to / instead of nginx's default
        # 404 page; genuine WordPress content misses (no .php extension)
        # are untouched and still get WordPress's own themed 404 via
        # @fallback above.
        try_files $uri @php_not_found;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Defense in depth alongside expose_php=Off in php.ini (see
        # Dockerfile) -- if that setting ever changes some other way, this
        # still strips the header at the point it'd otherwise reach the
        # client.
        fastcgi_hide_header X-Powered-By;
    }

    # Webroot is a tenant-writable volume (SFTP uploads land here) --
    # never let nginx serve dotfiles (.env, .git, etc.) regardless of what
    # a tenant uploads.
    location ~ /\. {
        deny all;
    }

    # Only reachable via the ~ \.php$ location's try_files fallback above,
    # never matched directly by a client request.
    location @php_not_found {
        return 301 /;
    }
}

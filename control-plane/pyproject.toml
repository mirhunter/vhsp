[project]
name = "vhsp-ctl"
# Read from vhsp_ctl.__version__ rather than duplicated here -- one line
# to bump at release time, and the running code and the package metadata
# can't drift apart. See vhsp_ctl/__init__.py and UPDATING.md.
dynamic = ["version"]
description = "VHSP control plane: tenant provisioning skeleton"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0",
    "click>=8.1",
    "flask>=3.0",
    "passlib>=1.7",
    "fido2>=2.0",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "gunicorn>=22.0",
    "cryptography>=42.0",
    "fastmcp>=3.4",
    # Declared explicitly even though `docker` already pulls it in
    # transitively: update_check.py imports it directly, and depending on
    # another package's dependency means a future docker release that
    # drops or swaps it breaks this one silently.
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vhsp = "vhsp_ctl.cli:cli"
vhsp-admin = "vhsp_ctl.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vhsp_ctl"]

[tool.setuptools.dynamic]
version = {attr = "vhsp_ctl.__version__"}

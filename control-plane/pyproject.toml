[project]
name = "vhsp-ctl"
version = "0.1.0"
description = "VHSP control plane: tenant provisioning skeleton"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0",
    "click>=8.1",
    "flask>=3.0",
    "passlib>=1.7",
    "fido2>=2.0",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "gunicorn>=22.0",
    "cryptography>=42.0",
    "fastmcp>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vhsp = "vhsp_ctl.cli:cli"
vhsp-admin = "vhsp_ctl.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vhsp_ctl"]
